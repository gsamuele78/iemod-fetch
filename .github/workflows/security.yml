# Security scanning. Separate from CI so a scanner outage or a new advisory in a
# transitive dev dependency does not block an unrelated pull request — these
# report, CI gates.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"     # Monday morning: new advisories land over the weekend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install "bandit[toml]"

      # Configured in pyproject.toml, where each skipped rule carries the reason
      # it is skipped. An unexplained skip is a decision nobody can revisit.
      - name: bandit
        run: bandit -q -c pyproject.toml -r iemod_fetch/

  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit

      # The shipped tool has no runtime dependency at all (ADR-0002), so this
      # audits the developer toolchain — the only supply chain there is.
      - name: Audit the developer toolchain
        run: |
          pip install -e ".[dev]"
          pip-audit --strict --desc

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3

  workflows:
    name: Workflow SAST (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      # Pinned for the same reason as the linters: a new zizmor release adds
      # audits, and an unpinned gate turns red with no change to the workflows.
      - run: pip install zizmor==1.31.1

      # The workflows are themselves attack surface: an over-permissioned token,
      # a checkout that persists credentials, an unpinned action. This checks
      # the CI the way bandit checks the code.
      - name: zizmor
        # Low/informational findings are advice (e.g. 'use gh release instead of
        # an action'); medium and above block.
        run: zizmor --persona=regular --min-severity=medium .github/workflows/
