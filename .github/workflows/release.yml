# Cut a release - automatically (ADR-0027). Nothing here reads a long-lived
# secret: PyPI is reached with OIDC trusted publishing, the signing identity is
# the workflow itself, and the tag is made with this run's own GITHUB_TOKEN.
#
# When main gets a CHANGELOG.md whose newest `## [X.Y.Z]` section has no tag
# yet, tools/release_plan.py names the commit to release (the main-line merge
# where __version__ became X.Y.Z), and this workflow builds it, attests it,
# tags it vX.Y.Z and publishes the GitHub Release with that section as notes.
# The tag is created here and not pushed separately because a tag pushed with
# GITHUB_TOKEN starts no workflow. A tag pushed by hand still works.
name: Release

on:
  push:
    branches: [main]
    paths: ["CHANGELOG.md", "iemod_fetch/__init__.py"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release this version (e.g. 2.1.0) if it has no tag yet; empty = newest in CHANGELOG.md"
        required: false
        default: ""
      dry_run:
        description: "Build and attest, but publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    name: What to release, and which commit
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      latest: ${{ steps.plan.outputs.latest }}
      workflows_differ: ${{ steps.plan.outputs.workflows_differ }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false, fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Plan
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            # A tag pushed by hand: release exactly what it points at.
            { echo "release=true"; echo "tag=$REF_NAME"; echo "sha=$GITHUB_SHA"; } >> "$GITHUB_OUTPUT"
          else
            python tools/release_plan.py $VERSION >> "$GITHUB_OUTPUT"
          fi
          newest=$(python -c "import tools.release_plan as r; print(r.newest_release(open('CHANGELOG.md', encoding='utf-8').read()))")
          tag=$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -1)
          if [ "$tag" = "v$newest" ]; then echo "latest=true"; else echo "latest=false"; fi >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      # GITHUB_TOKEN cannot create a tag on a commit whose workflow files differ
      # from main's (it can never hold the `workflows` permission): GitHub
      # answers 403 at the very last step. Say so now, with the two ways out.
      - name: The tag can be created with the token this run has
        env:
          DIFFER: ${{ steps.plan.outputs.workflows_differ }}
          HAS_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          if [ "$DIFFER" = "true" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::$TAG is on $SHA, whose workflow files differ from main's; GITHUB_TOKEN may not create that tag. Push it by hand (git tag $TAG $SHA && git push origin $TAG) and run this workflow again with this version, or add a RELEASE_TOKEN secret with contents and workflows write. See docs/RELEASING.md."
            exit 1
          fi

  verify:
    name: Re-run the full gate
    needs: [decide]
    if: needs.decide.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: [decide, verify]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      - run: pip install build cyclonedx-bom

      - name: The tag and the packaged version agree
        env:
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          tag="${TAG#v}"
          pkg=$(python -c "import iemod_fetch; print(iemod_fetch.__version__)")
          test "$tag" = "$pkg" || {
            echo "tag $tag does not match packaged version $pkg"; exit 1; }

      # Not `python -m build`: with the repository as the working directory that
      # imports this repository's own build.py (the zipapp script), not PyPA's
      # build, and no dist/ is ever made.
      - name: sdist and wheel
        run: pyproject-build

      - name: Single-file zipapp
        run: |
          python build.py
          cp iemod-fetch.pyz dist/

      - name: Digest of the artifact people actually download
        id: digest
        run: |
          echo "sha256=$(sha256sum dist/iemod-fetch.pyz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum * > SHA256SUMS)

      # An SBOM for a tool with no runtime dependencies is a short document, and
      # that is the point: it is the machine-readable form of the claim, and a
      # consumer's policy engine can check it without taking my word for it.
      - name: SBOM (CycloneDX)
        run: cyclonedx-py environment -o dist/iemod-fetch.sbom.json || \
             cyclonedx-py -o dist/iemod-fetch.sbom.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  provenance:
    name: Build provenance
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # Sigstore, keyless
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist, path: dist }

      # Says which workflow, at which commit, produced these bytes. Verifiable
      # with `gh attestation verify dist/iemod-fetch.pyz --repo <owner>/<repo>`.
      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: |
            dist/iemod-fetch.pyz
            dist/*.whl
            dist/*.tar.gz

  publish-github:
    name: Tag and GitHub Release
    needs: [decide, build, provenance]
    if: needs.decide.outputs.release == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write          # creates the tag together with the release
    steps:
      # The notes come from CHANGELOG.md as it is NOW, not at the release
      # commit: a correction to an old section reaches its release by running
      # this workflow for that version. The artifacts are built from the
      # release commit (job `build`).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist, path: dist }

      - name: Release notes from the changelog
        # Values reach the script through the environment, never by template
        # expansion into its source: a tag name is attacker-chosen text.
        env:
          TAG: ${{ needs.decide.outputs.tag }}
          DIGEST: ${{ needs.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY' > NOTES.md
          import os, pathlib, re
          tag = os.environ["TAG"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## \[{re.escape(tag)}\].*?$(.*?)(?=^## \[|\Z)",
                            text, re.S | re.M)
          print(match.group(1).strip() if match
                else f"See CHANGELOG.md for {tag}.")
          PY
          {
            echo
            echo '### Verify this download'
            echo '```'
            echo "sha256  ${DIGEST}  iemod-fetch.pyz"
            echo "gh attestation verify iemod-fetch.pyz --repo ${REPOSITORY}"
            echo '```'
          } >> NOTES.md

      # Creates tag vX.Y.Z on the planned commit if it does not exist yet, and
      # publishes. The notes are the changelog section a reviewer already read
      # in the release pull request.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.decide.outputs.tag }}
          target_commitish: ${{ needs.decide.outputs.sha }}
          name: ${{ needs.decide.outputs.tag }}
          body_path: NOTES.md
          files: dist/*
          draft: false
          make_latest: ${{ needs.decide.outputs.latest }}
          # Optional: only a back-fill onto a commit with other workflow files
          # needs a token with the `workflows` permission (ADR-0027).
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fail_on_unmatched_files: true

  publish-pypi:
    name: PyPI (trusted publishing)
    needs: [decide, build, provenance]
    # Opt-in: set the repository variable PYPI_PUBLISH=true once PyPI trusts
    # this workflow, so an unconfigured PyPI never turns a release red.
    if: needs.decide.outputs.release == 'true' && !inputs.dry_run && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi          # requires a manual approval on the environment
    permissions:
      id-token: write          # OIDC — no API token stored anywhere
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist, path: dist }
      - name: Drop the non-Python artifacts
        run: rm -f dist/iemod-fetch.pyz dist/SHA256SUMS dist/*.sbom.json
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
