# The wizard's macOS bundle (ADR-0040), apart from the release. GitHub's macOS
# runners started no job from 2026-10-21 to 2026-10-23: a job waiting for one
# stays queued, not failed, and a queued job in release.yml kept its run - and
# the `release` concurrency group, so the next release too - waiting. Here it
# holds up nothing: release.yml starts it for each new release (a dispatch with
# the tag), and every six hours it looks at the latest release and, when it
# has no macOS bundle yet, builds one from the release's tag, attests it and
# attaches it, with its own .sha256. A pull request that changes the packaging
# rehearses the build only. (A schedule, not workflow_run: nothing from another
# run is trusted, and a quiet check costs one short Linux job.)
name: Release - macOS wizard bundle

on:
  schedule:
    - cron: "41 */6 * * *"
  pull_request:
    paths: ["packaging/**", ".github/workflows/release-macos.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach to this release (e.g. v3.0.0); empty = the latest"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Scheduled checks replace one another (each looks at the latest release); a
  # dispatch for a named release has its own group and is never cancelled, so a
  # scheduled run that builds nothing cannot drop it. A rehearsal per pull request.
  group: release-macos-${{ github.event_name }}-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  target:
    name: Which release needs a macOS bundle
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          WANTED: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tag="${WANTED:-$(gh release view --repo "$REPOSITORY" --json tagName -q .tagName)}"
          has=$(gh release view "$tag" --repo "$REPOSITORY" --json assets \
                -q '[.assets[].name | select(startswith("iemod-fetch-gui-macos"))] | length')
          # a release made before ADR-0040 has nothing to build it with
          if gh api "repos/$REPOSITORY/contents/packaging/gui_bundle.py?ref=$tag" --silent 2>/dev/null; then
            buildable=yes; else buildable=no; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$has" = 0 ] && [ "$buildable" = yes ]; then echo "build=true"; else echo "build=false"; fi >> "$GITHUB_OUTPUT"
          echo "release $tag: macOS bundles attached $has, packaging script present: $buildable"

  build:
    name: Wizard bundle (macos-latest)
    needs: target
    if: needs.target.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.target.outputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install ".[gui]" "pyinstaller==6.22.3"
      - name: Build, sign ad hoc, zip, start the unzipped copy once
        run: python packaging/gui_bundle.py --dist gui-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-gui
          path: gui-dist/*.zip

  attach:
    name: Attest and attach to the release
    needs: [target, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # uploads to the release release.yml published
      id-token: write          # Sigstore, keyless
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: macos-gui, path: dist }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/iemod-fetch-gui-*.zip
      - name: Upload it with its digest
        env:
          TAG: ${{ needs.target.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd dist
          for zip in iemod-fetch-gui-*.zip; do sha256sum "$zip" > "$zip.sha256"; done
          gh release upload "$TAG" iemod-fetch-gui-*.zip iemod-fetch-gui-*.zip.sha256 \
            --repo "$REPOSITORY" --clobber
