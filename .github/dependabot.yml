version: 2
updates:
  # The developer toolchain (pyproject.toml's extras).
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  # The runtime's libraries, pinned by hash (ADR-0043): their own pull request,
  # since they ship to players. publicsuffixlist releases with every change to
  # the list, so weekly and grouped.
  - package-ecosystem: pip
    directory: /requirements
    schedule: { interval: weekly, day: monday }
    groups:
      runtime:
        patterns: ["*"]
    commit-message:
      prefix: "deps(runtime)"

  # An unpinned action is remote code with write access to the release job.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  # Not covered here: the WeiDU zip and the mod_installer commit pinned in
  # ci.yml. upstream-versions.yml watches those (ADR-0028).
